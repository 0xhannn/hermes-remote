<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion — Hermes Remote</title>
  <link rel="stylesheet" href="/assets/ui-enhancements.css?v=3">
  <link rel="icon" type="image/svg+xml" href="/assets/hermes-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-page:#FAF8F5; --bg-card:#FFFFFF; --bg-subtle:#FAF7F0;
      --card-border:#E8E2D9; --text-main:#1C1917; --text-muted:#78716C;
      --blue-dev:#2563EB; --blue-hover:#1D4ED8; --blue-border:#93C5FD; --blue-soft:#EFF6FF;
      --status-green:#22C55E; --status-green-bg:#DCFCE7; --status-green-text:#166534;
      --danger-red:#DC2626; --danger-bg:#FEE2E2; --danger-border:#FCA5A5;
      --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;outline:none}
    html,body,*{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none}
    body{background:var(--bg-page);color:var(--text-main);font-family:var(--font-sans);min-height:100vh;line-height:1.5}
    .wrap{max-width:880px;margin:0 auto;padding:32px 20px 64px}
    .top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
    .back{text-decoration:none;color:var(--text-muted);font-size:14px;border:1px solid var(--card-border);padding:6px 12px;border-radius:8px}
    .back:hover{color:var(--blue-dev);border-color:var(--blue-border)}
    h1{font-size:22px;font-weight:700}
    .sub{color:var(--text-muted);font-size:13px;margin-bottom:24px;display:flex;align-items:center;gap:8px}
    .badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
    .badge.on{background:var(--status-green-bg);color:var(--status-green-text)}
    .badge.off{background:var(--danger-bg);color:var(--danger-red)}
    .card{background:var(--bg-card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-top:16px}
    .card h2{font-size:15px;margin-bottom:14px}
    label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}
    input[type=text],input[type=password],select{width:100%;padding:10px 14px;border:1px solid var(--card-border);border-radius:8px;font-family:var(--font-mono);font-size:14px;background:var(--bg-subtle)}
    input:focus,select:focus{border-color:var(--blue-border)}
    .row{display:flex;gap:10px;align-items:center}
    .row .grow{flex:1}
    .btn{border:none;border-radius:9px;padding:10px 16px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;background:var(--blue-dev);color:#fff;white-space:nowrap}
    .btn:hover{background:var(--blue-hover)}
    .btn.ghost{background:transparent;border:1px solid var(--card-border);color:var(--text-main)}
    .btn.danger{background:var(--danger-bg);color:var(--danger-red);border:1px solid var(--danger-border)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:13px;border-radius:8px;padding:10px 14px;margin-top:12px;display:none}
    .msg.ok{display:block;background:var(--status-green-bg);color:var(--status-green-text)}
    .msg.err{display:block;background:var(--danger-bg);color:var(--danger-red)}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .item{border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-card)}
    .item:hover{border-color:var(--blue-border)}
    .item .t{font-weight:600;font-size:14px}
    .item .a{font-size:12px;color:var(--text-muted)}
    .md{font-family:var(--font-mono);font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .md h1,.md h2,.md h3{font-family:var(--font-sans);line-height:1.35;margin:14px 0 6px}
    .md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
    .md p{margin:4px 0}
    .md .bullet{margin:3px 0;padding-left:6px}
    .md .num{margin:3px 0;padding-left:6px;display:flex;gap:8px}
    .md .quote{border-left:3px solid var(--blue-border);padding:4px 10px;margin:6px 0;background:var(--blue-soft);border-radius:0 8px 8px 0;color:var(--text-main)}
    .md .callout{display:flex;gap:10px;background:#F7F6F3;border:1px solid #E8E7E4;border-radius:10px;padding:12px 14px;margin:8px 0}
    .md .callout .ico{font-size:18px;line-height:1.4}
    .md .callout .co-body{flex:1}
    .md .callout p{margin:2px 0}
    .md details.toggle{border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;margin:6px 0;background:var(--bg-subtle)}
    .md details.toggle summary{cursor:pointer;font-weight:600;list-style:none}
    .md details.toggle summary::-webkit-details-marker{display:none}
    .md details.toggle summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
    .md details.toggle[open] summary::before{transform:rotate(90deg)}
    .md details.toggle .tg-body{border-top:1px solid var(--card-border);margin-top:8px;padding-top:8px}
    .md del{color:var(--text-muted)}
    .notion{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";font-size:16px;line-height:1.5;color:#37352F;max-width:708px}
    .notion .np{padding:3px 2px;margin:1px 0}
    .notion h1,.notion h2,.notion h3,.notion h4{font-weight:600;line-height:1.3;padding:3px 2px;margin-bottom:1px}
    .notion h1{font-size:30px;margin-top:1.08em}.notion h2{font-size:24px;margin-top:1.1em}.notion h3{font-size:20px;margin-top:1em}.notion h4{font-size:18px;margin-top:1em}
    .notion .ncover{max-width:708px}
    .notion .ncover img{width:100%;max-height:260px;object-fit:cover;border-radius:4px;display:block}
    .notion a{color:rgb(35,78,120);text-decoration:none;border-bottom:1px solid rgba(35,78,120,.3)}
    .notion a:hover{border-bottom-color:rgba(35,78,120,.8)}
    .notion .nc{font-family:SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:85%;background:rgba(135,131,120,.15);border-radius:3px;padding:0 4px}
    .notion .nli{display:flex;gap:8px;padding:6px 0}
    .notion .nmark{flex:0 0 auto;width:22px;text-align:right}
    .notion .ncont{flex:1;min-width:0}
    .notion .nsub{padding-left:12px}
    .notion .ntodo{display:flex;gap:10px;align-items:flex-start;margin:2px 0}
    .notion .ntodo input{margin-top:4px;accent-color:#2383E2;width:16px;height:16px}
    .notion .ntoggle{padding:3px 2px}
    .notion .ntoggle summary{cursor:pointer;list-style:none;font-weight:500}
    .notion .ntoggle summary::-webkit-details-marker{display:none}
    .notion .ntoggle summary::before{content:"▸ ";color:rgba(55,53,47,.5);display:inline-block;transition:transform .15s;width:18px}
    .notion .ntoggle[open] summary::before{transform:rotate(90deg)}
    .notion .ntg-body{padding-left:1.1em}
    .notion .nquote{border-left:3px solid currentColor;padding:0.2em 0.9em;margin:6px 0;font-size:1.2em;line-height:1.4}
    .notion .ncallout{display:flex;gap:12px;align-items:center;padding:16px 16px 16px 12px;background:#F1F0EF;border:1px solid rgba(55,53,47,.06);border-radius:8px;margin:4px 0}
    .notion .nco-ico{flex:0 0 auto;font-size:1.3em;width:24px;height:24px;line-height:24px;text-align:center}
    .notion .nco-body{flex:1}
    .notion .ncode-wrap{position:relative;margin:8px 0;background:#F7F6F3;border-radius:4px;overflow:hidden}
    .notion .ncode-lang{position:absolute;top:6px;right:10px;font-size:11px;color:rgba(55,53,47,.5);text-transform:uppercase;letter-spacing:.02em}
    .notion .ncode{padding:16px;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:auto}
    .notion .ndivider{border:none;border-top:1px solid rgba(55,53,47,.09);margin:6px 0}
    .notion .npage{display:inline-flex;align-items:center;gap:8px;border-bottom:none;cursor:pointer;width:100%;box-sizing:border-box;padding:6px;margin:1px 0;border-radius:4px}
    .notion .npage:hover{background:rgba(55,53,47,.04)}
    .notion .np-icon{font-size:16px;width:22px;flex:0 0 auto;display:inline-flex;justify-content:center;align-items:center}
    .notion .np-icon img{width:18px;height:18px;object-fit:cover;border-radius:3px}
    .notion .ntable{border-collapse:collapse;width:100%;margin:6px 0;font-size:14px}
    .notion .ntable td{border:1px solid rgba(55,53,47,.12);padding:6px 10px;vertical-align:top}
    .notion .ncols{display:flex;gap:12px}
    .notion .ncol{flex:1;min-width:0}
    .notion .nbookmark{display:flex;gap:10px;align-items:center;border:1px solid rgba(55,53,47,.12);border-radius:8px;padding:10px 14px;margin:6px 0}
    .notion .nbk-txt{display:flex;flex-direction:column;min-width:0}
    .notion .nbk-url{font-size:12px;color:rgba(55,53,47,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .notion .nmedia{margin:8px 0}
    .notion .nmedia img{max-width:100%;border-radius:4px;display:block}
    .notion .nmedia figcaption{font-size:13px;color:rgba(55,53,47,.6);text-align:center;margin-top:6px}
    .notion .neq{background:rgba(135,131,120,.08);border-radius:4px;padding:8px 12px;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-align:center;margin:6px 0}
    .notion .ncol-red{color:#D44C47}.notion .ncol-orange{color:#D9730D}.notion .ncol-yellow{color:#CB912F}
    .notion .ncol-green{color:#448361}.notion .ncol-blue{color:#337EA9}.notion .ncol-purple{color:#9065B0}
    .notion .ncol-pink{color:#C14C8A}.notion .ncol-brown{color:#9F6B53}
    .notion .ncol-red-background{background:rgba(212,76,71,.12);border-radius:2px}.notion .ncol-orange-background{background:rgba(217,115,13,.12);border-radius:2px}
    .notion .ncol-yellow-background{background:rgba(203,145,47,.12);border-radius:2px}.notion .ncol-green-background{background:rgba(68,131,97,.12);border-radius:2px}
    .notion .ncol-blue-background{background:rgba(51,126,169,.12);border-radius:2px}.notion .ncol-purple-background{background:rgba(144,101,176,.12);border-radius:2px}
    .notion .ncol-pink-background{background:rgba(193,76,138,.12);border-radius:2px}.notion .ncol-brown-background{background:rgba(159,107,83,.12);border-radius:2px}
    .pt{font-size:40px;font-weight:600;line-height:1.2;margin:0 0 20px;padding:3px 2px;word-break:break-word}
    .pt .page-ico{margin-right:12px;font-size:44px;vertical-align:middle;display:inline-block;line-height:1}
    .md .todo{display:block;margin:4px 0}
    .md .todo input{margin-right:8px;accent-color:var(--blue-dev)}
    .md code{background:var(--bg-subtle);border:1px solid var(--card-border);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);font-size:12px}
    .md pre{background:#1C1917;color:#E7E5E4;border-radius:10px;padding:12px 14px;margin:8px 0;overflow-x:auto}
    .md pre code{background:transparent;border:none;color:inherit;padding:0}
    .md hr{border:none;border-top:1px solid var(--card-border);margin:12px 0}
    .md table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
    .md th,.md td{border:1px solid var(--card-border);padding:6px 10px;text-align:left}
    .md th{background:var(--bg-subtle);font-weight:600}
    .md .subpage{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);border:1px solid var(--blue-border);color:var(--blue-dev);border-radius:8px;padding:3px 10px;margin:2px 0;cursor:pointer;text-decoration:none;font-weight:600;font-size:13px}
    .md .subpage:hover{background:var(--blue-dev);color:#fff}
    .muted{color:var(--text-muted);font-size:13px}
    .spinner{color:var(--blue-dev);font-size:13px}
    .hide{display:none}
  </style>
</head>

      <a class="nav-link" href="/logs/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M7 15h4M7 17h2"/></svg><span>Log</span></a>
      <div class="nav-group open">

    </nav>
    <div class="sidebar-foot"><span class="status-pill"><i></i>Live</span></div>
  </aside>
  <main class="main-content">
  <div class="container">
<div class="wrap">
    <div class="top">
      <a class="back" href="/">← Kembali</a>
      <h1>Notion Integration</h1>
      <span id="statusBadge" class="badge off">nonaktif</span>
    </div>
    <div class="sub">Fitur opsional — tarik/tulis halaman Notion (SSoT) dari Hermes Remote. Lepas pasang tanpa memengaruhi fungsi lokal.</div>

    <div id="authCard" class="card hide">
      <h2>Masukkan PIN</h2>
      <div class="row">
        <input class="grow" type="password" id="pinInput" placeholder="PIN akses..." autocomplete="off">
        <button class="btn" id="pinBtn">Login</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </div>

    <div id="configCard" class="card hide">
      <h2>Konfigurasi</h2>
      <label>Notion Integration Token</label>
      <div class="row">
        <input class="grow" type="password" id="tokenInput" placeholder="secret_xxx..." autocomplete="off">
        <button class="btn" id="saveBtn">Simpan</button>
      </div>
      <div class="msg" id="cfgMsg"></div>
    </div>

    <div id="dbCard" class="card hide">
      <h2>Database</h2>
      <div class="row">
        <select class="grow" id="dbSelect"></select>
        <button class="btn" id="linkBtn">Gunakan</button>
      </div>
      <div class="msg" id="dbMsg"></div>
    </div>

    <div id="pagesCard" class="card hide">
      <div class="row">
        <h2 style="flex:1;margin:0">Halaman</h2>
        <button class="btn ghost" id="detachBtn">Lepas</button>
      </div>
      <div class="row" style="margin-top:12px">
        <input class="grow" type="text" id="searchInput" placeholder="cari semua halaman Notion...">
        <button class="btn ghost" id="searchBtn">Cari</button>
      </div>
      <div id="pagesList" class="list"></div>
    </div>

    <div id="pageCard" class="card hide">
      <div class="row">
        <h2 style="flex:1;margin:0" id="pageTitle">Halaman</h2>
        <button class="btn ghost" id="backBtn">← Daftar</button>
      </div>
      <div class="md" id="pageBody" style="margin-top:14px"></div>
    </div>
  </div>

  <script>
    let pin = localStorage.getItem('hermes_pin') || '';
    let cfg = null;
    const $ = id => document.getElementById(id);

    async function api(path, opts={}){
      const headers = Object.assign({'X-Hermes-PIN': pin}, opts.headers||{});
      if (opts.body) headers['Content-Type'] = 'application/json';
      const res = await fetch(path, Object.assign({}, opts, {headers}));
      let data = {};
      try { data = await res.json(); } catch(e){}
      return {status: res.status, data};
    }

    function guard(){
      if (pin) return true;
      $('authCard').classList.remove('hide');
      return false;
    }

    function showMsg(id, text, ok){ $(id).innerHTML = text;
      $(id).className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function loadCfg(){
      if (!guard()) return;
      const r = await api('/api/hermes/notion/config');
      if (r.status === 401){
        localStorage.removeItem('hermes_pin'); pin = '';
        $('authCard').classList.remove('hide');
        return;
      }
      if (r.status !== 200) return showMsg('cfgMsg', r.data.error || 'Gagal muat status', false);
      cfg = r.data;
      $('statusBadge').textContent = cfg.configured ? 'aktif' : 'nonaktif';
      $('statusBadge').className = 'badge ' + (cfg.configured ? 'on' : 'off');
      $('configCard').classList.toggle('hide', cfg.configured);
      $('dbCard').classList.add('hide');
      $('pagesCard').classList.toggle('hide', !cfg.configured);
      if (cfg.configured) await loadPages();
    }

    async function saveToken(){
      const token = $('tokenInput').value.trim();
      if (!token) return showMsg('cfgMsg', 'Token wajib diisi', false);
      $('saveBtn').disabled = true;
      const r = await api('/api/hermes/notion/config', {method:'POST', body: JSON.stringify({action:'set', token})});
      $('saveBtn').disabled = false;
      if (!r.data.success) return showMsg('cfgMsg', r.data.error || 'Gagal menyimpan token', false);
      showMsg('cfgMsg', r.data.validated ? 'Token valid.' : 'Token tersimpan (validasi lanjutan saat pilih database).', true);
      await loadCfg();
    }

    async function loadDbs(){
      if (!guard()) return;
      const r = await api('/api/hermes/notion/databases');
      if (!r.data.success) return showMsg('dbMsg', r.data.error || 'Gagal memuat database', false);
      const sel = $('dbSelect');
      sel.innerHTML = '';
      r.data.databases.forEach(db=>{
        const o = document.createElement('option');
        o.value = db.id; o.textContent = db.title;
        if (db.id === cfg.database_id) o.selected = true;
        sel.appendChild(o);
      });
      if (!r.data.databases.length){
        const o = document.createElement('option');
        o.textContent = '(tidak ada database)'; sel.appendChild(o);
      }
      await loadPages();
    }

    async function linkDb(){
      const dbId = $('dbSelect').value;
      if (!dbId) return showMsg('dbMsg', 'Pilih database dulu', false);
      const r = await api('/api/hermes/notion/config', {method:'POST', body: JSON.stringify({action:'set', token: (cfg&&cfg.token)||'', database_id: dbId})});
      if (!r.data.success) return showMsg('dbMsg', r.data.error || 'Gagal memilih database', false);
      showMsg('dbMsg', 'Database dipilih.', true);
      await loadCfg();
    }

    async function detach(){
      const r = await api('/api/hermes/notion/config', {method:'POST', body: JSON.stringify({action:'clear'})});
      if (r.data.success) await loadCfg();
    }

    async function loadPages(){
      const q = $('searchInput').value.trim();
      const r = await api('/api/hermes/notion/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
      const box = $('pagesList');
      box.innerHTML = '';
      if (!r.data.success) return showMsg('dbMsg', r.data.error || 'Gagal mencari halaman', false);
      if (!r.data.items || !r.data.items.length){
        box.innerHTML = '<div class="muted">Tidak ada halaman ditemukan.</div>'; return;
      }
      r.data.items.forEach(p=>{
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<div><div class="t"></div><div class="a"></div></div><button class="btn ghost">Buka</button>';
        el.querySelector('.t').textContent = p.title;
        el.querySelector('.a').textContent = p.id;
        const opener = p.kind === 'page'
          ? () => openPage(p.id, p.title)
          : () => { showMsg('dbMsg', 'Ini database — pilih halaman di dalamnya dari daftar global.', false); };
        el.querySelector('button').onclick = opener;
        box.appendChild(el);
      });
    }

    function escHtml(s){
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function inlineHtml(s){
      s = s.replace(/\[([^\]]+)\]\(__notion__([a-f0-9-]+)\)/g, (m,title,id)=>{
        return '<a href="#" class="subpage" data-notion="'+escHtml(id)+'" data-title="'+escHtml(title)+'">📄 '+escHtml(title)+'</a>';
      });
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
      s = s.replace(/~~(.+?)~~/g,'<del>$1</del>');
      s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
      return s;
    }
    function renderMarkdown(md){
      const lines = md.split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length){
        const raw = lines[i];
        const tr = raw.trim();
        const cm = tr.match(/^:::([a-z]+)(?:\s+(.*))?$/);
        if (cm){
          const kind = cm[1];
          const meta = (cm[2] || '').trim();
          const inner = [];
          i++;
          while (i < lines.length && lines[i].trim() !== ':::'){
            inner.push(lines[i]); i++;
          }
          i++; // closing :::
          const innerHtml = renderMarkdown(inner.join('\n'));
          if (kind === 'callout'){
            const ico = meta ? '<span class="ico">'+escHtml(meta)+'</span>' : '';
            out.push('<div class="callout">'+ico+'<div class="co-body">'+innerHtml+'</div></div>');
          } else if (kind === 'toggle'){
            const m = innerHtml.match(/<p>([\s\S]*?)<\/p>/);
            const title = m ? m[1] : '(toggle)';
            const rest = m ? innerHtml.replace(m[0], '') : innerHtml;
            out.push('<details class="toggle"><summary>'+title+'</summary><div class="tg-body">'+rest+'</div></details>');
          } else {
            out.push(innerHtml);
          }
          continue;
        }
        if (/^```/.test(tr)){
          let buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())){ buf.push(lines[i]); i++; }
          i++;
          out.push('<pre><code>' + escHtml(buf.join('\n')) + '</code></pre>');
          continue;
        }
        if (/^\|/.test(tr)){
          const rows = [];
          while (i < lines.length && /^\|/.test(lines[i].trim())){
            rows.push(lines[i].trim().replace(/^\||$/g,'')); i++;
          }
          const parsed = rows.map(r => r.split('|').map(c => c.trim()).filter(c => c !== ''));
          let html = '<table>';
          parsed.forEach((row, idx)=>{
            const tag = idx === 0 ? 'th' : 'td';
            html += '<tr>' + row.map(c => '<'+tag+'>'+inlineHtml(escHtml(c))+'</'+tag+'>').join('') + '</tr>';
          });
          out.push(html + '</table>');
          continue;
        }
        const h = tr.match(/^(#{1,3})\s+(.*)/);
        if (h){ const lvl=h[1].length; out.push('<h'+lvl+'>'+inlineHtml(escHtml(h[2]))+'</h'+lvl+'>'); i++; continue; }
        const todo = tr.match(/^- \[([ xX])\]\s+(.*)/);
        if (todo){ const chk=todo[1].toLowerCase()==='x'?'checked':''; out.push('<label class="todo"><input type="checkbox" '+chk+' disabled> '+inlineHtml(escHtml(todo[2]))+'</label>'); i++; continue; }
        const bullet = tr.match(/^-\s+(.*)/);
        if (bullet){ out.push('<div class="bullet">'+inlineHtml(escHtml(bullet[1]))+'</div>'); i++; continue; }
        const num = tr.match(/^(\d+)\.\s+(.*)/);
        if (num){ out.push('<div class="num"><span>'+num[1]+'.</span> '+inlineHtml(escHtml(num[2]))+'</div>'); i++; continue; }
        const quote = tr.match(/^>\s+(.*)/);
        if (quote){ out.push('<div class="quote">'+inlineHtml(escHtml(quote[1]))+'</div>'); i++; continue; }
        if (/^---+$/.test(tr)){ out.push('<hr>'); i++; continue; }
        if (tr) out.push('<p>'+inlineHtml(escHtml(raw))+'</p>');
        i++;
      }
      return out.join('');
    }

    function ntAttr(rt){
      return (rt || []).map(s=>{
        let t = escHtml(s.t);
        if (s.b) t = '<strong>'+t+'</strong>';
        if (s.i) t = '<em>'+t+'</em>';
        if (s.u) t = '<u>'+t+'</u>';
        if (s.s) t = '<del>'+t+'</del>';
        if (s.c) t = '<code class="nc">'+t+'</code>';
        if (s.color && s.color !== 'default' && s.color !== 'gray'){
          t = '<span class="ncol ncol-'+escHtml(s.color).replace(/\//g,'-').replace(/_/g,'-')+'">'+t+'</span>';
        }
        if (s.href) t = '<a href="'+escHtml(s.href)+'" target="_blank" rel="noopener">'+t+'</a>';
        return t;
      }).join('');
    }
    function renderNotion(blocks, depth){
      depth = depth || 0;
      let html = '';
      let numCount = 0;
      let lastWasNum = false;
      for (const b of (blocks || [])){
        switch (b.type){
          case 'paragraph': html += '<p class="np">'+ntAttr(b.rt)+'</p>'; break;
          case 'heading_1': html += '<h1 class="nh1">'+ntAttr(b.rt)+'</h1>'; break;
          case 'heading_2': html += '<h2 class="nh2">'+ntAttr(b.rt)+'</h2>'; break;
          case 'heading_3': html += '<h3 class="nh3">'+ntAttr(b.rt)+'</h3>'; break;
          case 'heading_4': html += '<h4 class="nh4">'+ntAttr(b.rt)+'</h4>'; break;
          case 'bulleted_list_item':
            html += '<div class="nli nb"><span class="nmark">•</span><div class="ncont">'+ntAttr(b.rt)+(b.children?'<div class="nsub">'+renderNotion(b.children,depth+1)+'</div>':'')+'</div></div>';
            break;
          case 'numbered_list_item':
            if (!lastWasNum) numCount = 0;
            numCount++;
            html += '<div class="nli nn"><span class="nmark">'+numCount+'.</span><div class="ncont">'+ntAttr(b.rt)+(b.children?'<div class="nsub">'+renderNotion(b.children,depth+1)+'</div>':'')+'</div></div>';
            break;
          case 'to_do':
            html += '<div class="ntodo"><input type="checkbox" '+(b.checked?'checked':'')+' disabled><div class="ncont">'+ntAttr(b.rt)+(b.children?'<div class="nsub">'+renderNotion(b.children,depth+1)+'</div>':'')+'</div></div>';
            break;
          case 'toggle':
            html += '<details class="ntoggle"><summary>'+ntAttr(b.rt)+'</summary>'+(b.children?'<div class="ntg-body">'+renderNotion(b.children,depth+1)+'</div>':'')+'</details>';
            break;
          case 'quote': html += '<blockquote class="nquote">'+ntAttr(b.rt)+(b.children?renderNotion(b.children,depth+1):'')+'</blockquote>'; break;
          case 'callout':
            html += '<div class="ncallout"><span class="nco-ico">'+(b.icon?escHtml(b.icon):'💡')+'</span><div class="nco-body">'+ntAttr(b.rt)+(b.children?renderNotion(b.children,depth+1):'')+'</div></div>';
            break;
          case 'code':
            html += '<div class="ncode-wrap"><span class="ncode-lang">'+escHtml(b.lang||'')+'</span><pre class="ncode"><code>'+escHtml((b.rt||[]).map(x=>x.t).join(''))+'</code></pre></div>';
            break;
          case 'divider': html += '<hr class="ndivider">'; break;
          case 'child_page':
            let ico = '';
            if (b.icon){
              ico = b.icon.indexOf('http') === 0 ? '<img src="'+escHtml(b.icon)+'" alt="">' : escHtml(b.icon);
            }
            html += '<a href="#" class="npage" data-notion="'+escHtml(b.id)+'" data-title="'+escHtml(b.title)+'"><span class="np-icon">'+ico+'</span><span>'+escHtml(b.title)+'</span></a>';
            break;
          case 'table':
            if (b.children){ html += '<table class="ntable"><tbody>'; for (const r of b.children){ html += '<tr>'; for (const cell of (r.cells||[])){ html += '<td>'+ntAttr(cell)+'</td>'; } html += '</tr>'; } html += '</tbody></table>'; }
            break;
          case 'column_list':
            html += '<div class="ncols">'+(b.children?b.children.map(c=>'<div class="ncol">'+renderNotion(c.children||[],depth+1)+'</div>').join(''):'')+'</div>';
            break;
          case 'bookmark':
          case 'link_preview':
            html += '<a class="nbookmark" href="'+escHtml(b.url||'')+'" target="_blank" rel="noopener"><span class="nbk-icon">'+(b.icon?escHtml(b.icon):'🔗')+'</span><span class="nbk-txt">'+ntAttr(b.rt)+'<span class="nbk-url">'+escHtml(b.url||'')+'</span></span></a>';
            break;
          case 'image':
          case 'embed':
          case 'video':
          case 'pdf':
          case 'file':
          case 'audio':
            html += '<figure class="nmedia">';
            if (b.type==='image' && b.url) html += '<img src="'+escHtml(b.url)+'" alt="">';
            else if (b.url) html += '<a href="'+escHtml(b.url)+'" target="_blank" rel="noopener">🔗 '+escHtml(b.url)+'</a>';
            if (b.caption) html += '<figcaption>'+escHtml(b.caption)+'</figcaption>';
            html += '</figure>';
            break;
          case 'equation': html += '<div class="neq">'+escHtml(b.expr||'')+'</div>'; break;
          default:
            if (b.children) html += renderNotion(b.children, depth+1);
            break;
        }
        lastWasNum = (b.type === 'numbered_list_item');
      }
      return html;
    }
    async function openPage(id, title){
      const r = await api('/api/hermes/notion/page_blocks?id=' + encodeURIComponent(id));
      if (!r.data.success) return showMsg('dbMsg', r.data.error || 'Gagal memuat halaman', false);
      const t = r.data.title || title;
      const icon = r.data.icon ? '<span class="page-ico">'+escHtml(r.data.icon)+'</span>' : '';
      $('pageTitle').className = 'pt';
      $('pageTitle').innerHTML = icon + escHtml(t);
      $('pageBody').className = 'notion';
      const coverHtml = r.data.cover ? '<div class="ncover"><img src="'+escHtml(r.data.cover)+'" alt=""></div>' : '';
      $('pageBody').innerHTML = coverHtml + renderNotion(r.data.blocks || []);
      $('pagesCard').classList.add('hide');
      $('pageCard').classList.remove('hide');
    }

    $('saveBtn').onclick = saveToken;
    $('linkBtn').onclick = linkDb;
    $('detachBtn').onclick = detach;
    $('searchBtn').onclick = loadPages;
    $('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadPages(); });
    $('backBtn').onclick = () => { $('pageCard').classList.add('hide'); $('pagesCard').classList.remove('hide'); };
    $('pageCard').addEventListener('click', e=>{
      const a = e.target.closest('a[data-notion]');
      if (a) e.preventDefault(), openPage(a.dataset.notion, a.dataset.title);
    });
    $('pinBtn').onclick = () => {
      const p = $('pinInput').value.trim();
      if (!p) return showMsg('authMsg', 'PIN wajib diisi', false);
      localStorage.setItem('hermes_pin', p);
      pin = p;
      $('authCard').classList.add('hide');
      loadCfg();
    };

    if (pin) loadCfg(); else $('authCard').classList.remove('hide');
  </script>
