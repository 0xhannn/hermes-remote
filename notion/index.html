<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion — Hermes Remote</title>
  <link rel="stylesheet" href="/assets/ui-enhancements.css?v=8">
  <link rel="icon" type="image/svg+xml" href="/assets/hermes-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/auth-guard.js"></script>
  <style>
    :root {
      --bg-page:#FAF8F5; --bg-card:#FFFFFF; --bg-subtle:#FAF7F0;
      --card-border:#E8E2D9; --text-main:#1C1917; --text-muted:#78716C;
      --blue-dev:#2563EB; --blue-hover:#1D4ED8; --blue-border:#93C5FD; --blue-soft:#EFF6FF;
      --status-green:#22C55E; --status-green-bg:#DCFCE7; --status-green-text:#166534;
      --danger-red:#DC2626; --danger-bg:#FEE2E2; --danger-border:#FCA5A5;
      --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;outline:none}
    html,body,*{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none}
    body{background:var(--bg-page);color:var(--text-main);font-family:var(--font-sans);min-height:100vh}
    .hide{display:none!important}
    .container{width:100%;max-width:100%}
    header{display:block;margin-bottom:32px}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
    .status-pill{background:var(--bg-card);border:1px solid var(--card-border);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--font-mono);display:inline-flex;align-items:center;gap:6px}
    .status-dot{width:8px;height:8px;background-color:#10B981;border-radius:50%}
    h1{font-size:28px;font-weight:800;letter-spacing:-0.5px;color:var(--text-main);margin-top:6px}
    .subtitle{color:var(--text-muted);font-size:14px;margin-top:4px}
    .badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600;margin-left:8px}
    .badge.on{background:var(--status-green-bg);color:var(--status-green-text)}
    .badge.off{background:var(--danger-bg);color:var(--danger-red)}
    .card{background:var(--bg-card);border:1px solid var(--card-border);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
    .card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
    .card-desc{font-size:13px;color:var(--text-muted);margin-top:-8px}
    .btn{font-family:var(--font-sans);font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--card-border);background:#FFFFFF;color:var(--text-main);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:all .15s ease;white-space:nowrap}
    .btn:hover{background:var(--bg-subtle);border-color:var(--blue-border)}
    .btn-primary{background:var(--blue-dev);color:#FFF;border-color:var(--blue-dev)}
    .btn-primary:hover{background:var(--blue-hover)}
    .btn-danger{background:var(--danger-bg);color:var(--danger-red);border-color:var(--danger-border)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
    input[type=text],input[type=password],select{width:100%;padding:10px 14px;border:1px solid var(--card-border);border-radius:8px;font-family:var(--font-mono);font-size:14px;background:var(--bg-subtle);color:var(--text-main)}
    input:focus,select:focus{border-color:var(--blue-border)}
    .row{display:flex;gap:10px;align-items:center}
    .row .grow{flex:1;min-width:0}
    .msg{font-size:13px;border-radius:8px;padding:10px 14px;display:none}
    .msg.ok{display:block;background:var(--status-green-bg);color:var(--status-green-text);border:1px solid var(--status-green)}
    .msg.err{display:block;background:var(--danger-bg);color:var(--danger-red);border:1px solid var(--danger-border)}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .item{border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-card)}
    .item:hover{border-color:var(--blue-border)}
    .item .t{font-weight:600;font-size:14px}
    .item .a{font-size:12px;color:var(--text-muted)}
    .md{font-family:var(--font-mono);font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .md h1,.md h2,.md h3{font-family:var(--font-sans);font-weight:700;margin:14px 0 6px;line-height:1.35;color:var(--text-main)}
    .md h1{font-size:20px;letter-spacing:0}.md h2{font-size:17px}.md h3{font-size:15px}
    .md p{margin:4px 0}
    .md ul,.md ol{margin:6px 0 6px 18px}
    .md li{margin:3px 0}
    .md a{color:var(--blue-dev)}
    .md code{background:var(--bg-subtle);padding:1px 5px;border-radius:5px}
    .md table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}
    .md th,.md td{border:1px solid var(--card-border);padding:6px 10px;text-align:left;font-family:var(--font-sans)}
    .md th{background:var(--bg-subtle)}
    .muted{color:var(--text-muted)}
    .empty{padding:28px 16px;text-align:center;color:var(--text-muted);font-size:13px}
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- hermes-sidebar --><aside class="sidebar" id="hermes-sidebar">
      <div class="sidebar-brand">
        <img src="/assets/hermes-icon.svg" alt="" width="28" height="28">
        <span class="brand-copy"><strong>Hermes Remote</strong><small>By PH Labs</small></span>
      </div>
      <nav class="sidebar-nav" aria-label="Utama">
        <a class="nav-link" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
        <a class="nav-link" href="/brain/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8V14a3 3 0 0 0 2.2 2.9A3 3 0 0 0 9 20h1V4H9z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 2.8V14a3 3 0 0 1-2.2 2.9A3 3 0 0 1 15 20h-1V4h1z"/><path d="M12 4v16"/></svg><span>Brain</span></a>
        <a class="nav-link" href="/context/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v4h4"/><path d="M8 12h8M8 16h5"/></svg><span>Context</span></a>
        <a class="nav-link" href="/skills/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5 16 6l2.5.4-1.8 1.8.4 2.5L14.5 9.6 12 10.7l-.4-2.5L9.8 6.4 12.3 6z"/><path d="M4 14h6v6H4z"/><path d="M14 15h6M14 19h4M12 4v2"/></svg><span>Skills</span></a>
        <a class="nav-link" href="/logs/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M7 15h4M7 17h2"/></svg><span>Log</span></a>
        <a class="nav-link" href="/settings/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot"><span class="status-pill"><i></i>Live</span></div>
    </aside>

    <main class="main-content">
      <div class="container">
        <header>
          <div class="brand-row"><div class="page-mark"></div><div class="status-pill"><span class="status-dot"></span> Notion</div></div>
          <h1>Notion</h1>
          <p class="subtitle">Halaman Aturan dan sub-halaman — render 1:1 dari API Notion. <span class="badge off" id="statusBadge">nonaktif</span></p>
        </header>

        <div class="card hide" id="configCard">
          <div class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M19 3h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M9 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"/><path d="M19 13h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"/></svg>
            Konfigurasi
          </div>
          <div class="card-desc">Masukkan token integrasi Notion. Token hanya tersimpan di server (file config), tidak pernah ditampilkan.</div>
          <label for="tokenInput">Token integrasi</label>
          <div class="row">
            <input class="grow" type="password" id="tokenInput" placeholder="secret_xxx..." autocomplete="off">
            <button class="btn btn-primary" id="saveBtn" onclick="saveToken()">Simpan</button>
          </div>
          <div class="msg" id="cfgMsg"></div>
        </div>

        <div class="card hide" id="pagesCard">
          <div class="row"><h2 style="flex:1;margin:0">Halaman</h2><button class="btn btn-danger" id="detachBtn" onclick="detach()">Lepas</button></div>
          <div class="row" style="margin-top:12px">
            <input class="grow" type="text" id="searchInput" placeholder="cari halaman Notion..." onkeypress="if(event.key==='Enter')loadPages()">
            <button class="btn" id="searchBtn" onclick="loadPages()">Cari</button>
          </div>
          <div id="pagesList" class="list"></div>
        </div>

        <div class="card hide" id="pageCard">
          <div class="row"><h2 style="flex:1;margin:0" id="pageTitle">Halaman</h2><button class="btn" id="backBtn" onclick="closePage()">← Daftar</button></div>
          <div class="md" id="pageBody" style="margin-top:14px"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/ui-enhancements.js?v=2"></script>
  <script>
    let pin = localStorage.getItem('hermes_pin') || '';
    let cfg = null;
    const $ = id => document.getElementById(id);

    async function api(path, opts={}){
      const headers = Object.assign({'X-Hermes-PIN': pin}, opts.headers||{});
      if (opts.body) headers['Content-Type'] = 'application/json';
      const res = await fetch(path, Object.assign({}, opts, {headers}));
      let data = {};
      try { data = await res.json(); } catch(e){}
      return {status: res.status, data};
    }

    function showMsg(id, text, ok){ $(id).textContent = text; $(id).className = 'msg ' + (ok ? 'ok' : 'err'); }

    async function loadCfg(){
      const r = await api('/api/hermes/notion/config');
      if (r.status === 401){
        localStorage.removeItem('hermes_pin'); pin = '';
        window.location.href = '/hermes/auth/?next=' + encodeURIComponent('/notion/');
        return;
      }
      if (r.status !== 200) return showMsg('cfgMsg', r.data.error || 'Gagal muat status', false);
      cfg = r.data;
      $('statusBadge').textContent = cfg.configured ? 'aktif' : 'nonaktif';
      $('statusBadge').className = 'badge ' + (cfg.configured ? 'on' : 'off');
      $('configCard').classList.toggle('hide', cfg.configured);
      $('pagesCard').classList.toggle('hide', !cfg.configured);
      if (cfg.configured) await loadPages();
    }

    async function saveToken(){
      const token = $('tokenInput').value.trim();
      if (!token) return showMsg('cfgMsg', 'Token wajib diisi', false);
      $('saveBtn').disabled = true;
      const r = await api('/api/hermes/notion/config', {method:'POST', body: JSON.stringify({action:'set', token})});
      $('saveBtn').disabled = false;
      if (!r.data.success) return showMsg('cfgMsg', r.data.error || 'Gagal menyimpan token', false);
      showMsg('cfgMsg', r.data.validated ? 'Token valid.' : 'Token tersimpan (validasi lanjutan saat pilih database).', true);
      await loadCfg();
    }

    async function loadPages(){
      if (!guard()) return;
      const q = $('searchInput').value.trim();
      const r = await api('/api/hermes/notion/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
      const box = $('pagesList');
      box.innerHTML = '';
      if (!r.data.success) return showMsg('cfgMsg', r.data.error || 'Gagal mencari halaman', false);
      if (!r.data.items || !r.data.items.length){ box.innerHTML = '<div class="empty">Tidak ada halaman ditemukan.</div>'; return; }
      r.data.items.forEach(p=>{
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<div><div class="t"></div><div class="a"></div></div><button class="btn ghost">Buka</button>';
        el.querySelector('.t').textContent = p.title;
        el.querySelector('.a').textContent = p.kind || 'halaman';
        el.querySelector('button').onclick = () => openPage(p.id, p.title);
        box.appendChild(el);
      });
    }

    async function openPage(id, title){
      $('pageTitle').textContent = title;
      $('pageBody').textContent = 'Memuat...';
      $('pagesCard').classList.add('hide');
      $('pageCard').classList.remove('hide');
      const r = await api('/api/hermes/notion/page_blocks?id=' + encodeURIComponent(id));
      if (r.status === 401){ localStorage.removeItem('hermes_pin'); pin=''; $('authCard').classList.remove('hide'); return; }
      if (!r.data.success) return $('pageBody').textContent = r.data.error || 'Gagal memuat halaman';
      renderMd($('pageBody'), r.data.markdown);
      // subpage nested: render link yang bisa dibuka
      $('pageBody').querySelectorAll('a.subpage').forEach(a=>{
        a.addEventListener('click', e=>{ e.preventDefault(); openPage(a.dataset.id, a.textContent); });
      });
    }

    function closePage(){ $('pageCard').classList.add('hide'); $('pagesCard').classList.remove('hide'); }

    // render markdown ringan (tanpa lib)
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function inline(s){
      s = esc(s);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
      return s;
    }
    function renderMd(el, md){
      const lines = md.split('\n');
      let html = '', list = null, inTable = false, tableRows = [];
      const flush = () => { if (!list) return; html += (list==='ul'?'<ul>':'<ol>') + list.map(x=>'<li>'+x+'</li>').join('') + (list==='ul'?'</ul>':'</ol>'); list = null; };
      for (let raw of lines){
        if (/^\|/.test(raw) && /\|$/.test(raw)){
          if (!inTable){ flush(); inTable = true; tableRows = []; }
          const cells = raw.split('|').slice(1,-1).map(c=>c.trim());
          tableRows.push(cells); continue;
        } else if (inTable){
          inTable = false;
          if (tableRows.length){
            let t='<table>'; const head = tableRows[0];
            if (head.some(c=>/[-:]+/.test(c))) tableRows.shift();
            t += '<tr>'+tableRows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>';
            for (let r of tableRows.slice(1)) t += '<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
            html += t + '</table>';
          }
          tableRows = [];
        }
        if (/^\s*[-*+]\s+/.test(raw)){ if (list!=='ul'){ flush(); list='ul'; } list.push(inline(raw.replace(/^\s*[-*+]\s+/,''))); continue; }
        if (/^\s*\d+\.\s+/.test(raw)){ if (list!=='ol'){ flush(); list='ol'; } list.push(inline(raw.replace(/^\s*\d+\.\s+/,''))); continue; }
        flush();
        if (/^#{1,6}\s+/.test(raw)){
          const m = raw.match(/^(#{1,6})\s+(.*)$/);
          const h = m[1].length;
          html += '<h'+Math.min(h,3)+'>'+inline(m[2])+'</h'+Math.min(h,3)+'>';
        } else if (/^---+\s*$/.test(raw)){
          html += '<hr style="border:none;border-top:1px solid var(--card-border);margin:12px 0">';
        } else if (/^>/.test(raw)){
          html += '<blockquote style="border-left:3px solid var(--blue-border);padding-left:12px;color:var(--text-muted);margin:6px 0">'+inline(raw.replace(/^>\s?/,''))+'</blockquote>';
        } else if (raw.trim()){
          html += '<p>'+inline(raw)+'</p>';
        } else {
          html += '<div style="height:6px"></div>';
        }
      }
      flush();
      if (inTable && tableRows.length){
        let t='<table>'; const head=tableRows[0];
        if (head.some(c=>/[-:]+/.test(c))) tableRows.shift();
        if (tableRows.length){ t += '<tr>'+tableRows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>'; }
        for (let r of tableRows.slice(1)) t += '<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
        html += t + '</table>';
      }
      el.innerHTML = html;
    }

    // init
    (async function init(){
      // auth guard via cookie (hermesGuard) — kalau belum auth, redirect ke /hermes/auth/
      const ok = await hermesGuard('/notion/');
      if (!ok) return;
      await loadCfg();
    })();
  </script>
</body>
</html>
