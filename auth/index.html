<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk · Hermes Remote</title>
  <link rel="icon" type="image/svg+xml" href="/assets/hermes-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F2EDE2;
      --card-bg: #FFFDF8;
      --card-border: #E4DDCE;
      --text-main: #26221B;
      --text-muted: #8A8173;
      --blue-dev: #2563EB;
      --blue-hover: #1D4ED8;
      --blue-border: #93C5FD;
      --blue-soft: #EFF6FF;
      --neon-blue: #0284EF;
      --neon-cyan: #22D3EE;
      --danger-red: #DC2626;
      --danger-bg: #FEE2E2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body, .auth-card {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .auth-card::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: var(--bg-page);
    }

    /* perspective neon grid floor */
    .gridfloor {
      position: absolute;
      left: 50%;
      bottom: -30%;
      width: 1200px;
      height: 900px;
      transform: translateX(-50%) perspective(800px) rotateX(60deg);
      pointer-events: none;
      background-image:
        linear-gradient(rgba(37, 99, 235, 0.18) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(37, 99, 235, 0.18) 1.5px, transparent 1.5px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    }

    /* rising light lines */
    .lines { position: absolute; inset: 0; pointer-events: none; }
    .line {
      position: absolute;
      bottom: -10px;
      width: 2px;
      height: 180px;
      background: linear-gradient(transparent, rgba(2, 132, 239, 0.5));
      border-radius: 2px;
      animation: rise var(--d) linear infinite;
      animation-delay: var(--dl);
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    .glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.35;
      background: radial-gradient(circle, #2563EB, transparent 70%);
    }
    .glow.g1 { top: -140px; left: -100px; }
    .glow.g2 { bottom: -120px; right: -100px; background: radial-gradient(circle, #22D3EE, transparent 70%); }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.10), 0 1px 3px rgba(38, 34, 27, 0.04);
      position: relative;
      z-index: 3;
    }

    .brand-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: block;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(38, 34, 27, 0.08);
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .auth-brand h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }
    .auth-brand p {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.4px;
      margin-bottom: 26px;
    }

    .input-box {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 3px;
      text-align: center;
      outline: none;
      background: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      color: var(--text-main);
    }
    .input-box:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, var(--blue-dev), var(--neon-blue));
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .err-msg {
      background: var(--danger-bg);
      color: var(--danger-red);
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="gridfloor"></div>
  <div class="lines">
    <span class="line" style="--d:10s;--dl:0s;left:15%"></span>
    <span class="line" style="--d:13s;--dl:2s;left:32%"></span>
    <span class="line" style="--d:9s;--dl:4s;left:50%"></span>
    <span class="line" style="--d:12s;--dl:1s;left:68%"></span>
    <span class="line" style="--d:11s;--dl:3s;left:84%"></span>
    <span class="line" style="--d:10.5s;--dl:5s;left:24%"></span>
    <span class="line" style="--d:12.5s;--dl:6s;left:58%"></span>
    <span class="line" style="--d:9.5s;--dl:7s;left:76%"></span>
  </div>

  <div class="auth-card">
    <div class="brand-mark">
      <img src="/assets/hermes-icon.svg" alt="Hermes Remote">
    </div>
    <div class="auth-brand">
      <h1>HERMES REMOTE</h1>
      <p>By PH Labs</p>
    </div>

    <div class="err-msg" id="errMsg">PIN Salah! Akses ditolak.</div>

    <label class="sr-only" for="pinField">Master PIN</label>
    <input type="password" id="pinField" class="input-box" placeholder="masukkan PIN" autocomplete="current-password" autofocus>
    <button class="btn" id="submitBtn">Masuk ke Portal</button>
  </div>

<script>
  const pinField = document.getElementById('pinField');
  const submitBtn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');

  function showErr(msg) {
    err.innerText = msg;
    err.style.display = 'block';
  }

  async function submitAuth() {
    const pin = pinField.value.trim();
    err.style.display = 'none';

    if (!pin) {
      showErr('PIN tidak boleh kosong');
      pinField.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Memverifikasi...';

    try {
      const res = await fetch('/api/hermes/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('hermes_pin', pin);
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.href = next;
      } else {
        showErr(data.error || 'PIN Salah!');
      }
    } catch (e) {
      showErr('Gagal menghubungi server');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Masuk ke Portal';
    }
  }

  submitBtn.addEventListener('click', submitAuth);
  pinField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAuth();
  });

  // Auto verify if already in localStorage
  window.addEventListener('load', async () => {
    const savedPin = localStorage.getItem('hermes_pin');
    if (!savedPin) return;
    try {
      const res = await fetch('/api/hermes/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: savedPin })
      });
      const data = await res.json();
      if (data.success) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.href = next;
      }
    } catch (e) {}
  });
</script>
</body>
</html>
