<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk · Hermes Remote</title>
  <link rel="icon" type="image/svg+xml" href="/assets/hermes-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #FAF8F5;
      --card-bg: #FFFFFF;
      --card-border: #E8E2D9;
      --text-main: #1C1917;
      --text-muted: #78716C;
      --blue-dev: #2563EB;
      --blue-hover: #1D4ED8;
      --blue-border: #93C5FD;
      --blue-soft: #EFF6FF;
      --danger-red: #DC2626;
      --danger-bg: #FEE2E2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body, .auth-card {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .auth-card::-webkit-scrollbar {
      display: none;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 36px 28px;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .auth-lock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--blue-soft);
      margin-bottom: 16px;
    }
    .auth-lock svg {
      width: 24px;
      height: 24px;
      stroke: var(--blue-dev);
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      background: var(--bg-page);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }
    .input-box:focus {
      border-color: var(--blue-dev);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn {
      width: 100%;
      background: var(--blue-dev);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn:hover { background: var(--blue-hover); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .err-msg {
      background: var(--danger-bg);
      color: var(--danger-red);
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-lock">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      <path d="M12 15v2"/>
    </svg>
  </div>
  <h1>Masuk</h1>
  <p class="auth-sub">Masukkan Master PIN untuk membuka panel Hermes Remote.</p>

  <div class="err-msg" id="errMsg">PIN Salah! Akses ditolak.</div>

  <label class="sr-only" for="pinField">Master PIN</label>
  <input type="password" id="pinField" class="input-box" placeholder="masukkan PIN" autocomplete="current-password" autofocus>
  <button class="btn" id="submitBtn">Masuk ke Portal</button>
</div>

<script>
  const pinField = document.getElementById('pinField');
  const submitBtn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');

  function showErr(msg) {
    err.innerText = msg;
    err.style.display = 'block';
  }

  async function submitAuth() {
    const pin = pinField.value.trim();
    err.style.display = 'none';

    if (!pin) {
      showErr('PIN tidak boleh kosong');
      pinField.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Memverifikasi...';

    try {
      const res = await fetch('/api/hermes/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('hermes_pin', pin);
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.href = next;
      } else {
        showErr(data.error || 'PIN Salah!');
      }
    } catch (e) {
      showErr('Gagal menghubungi server');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Masuk ke Portal';
    }
  }

  submitBtn.addEventListener('click', submitAuth);
  pinField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAuth();
  });

  // Auto verify if already in localStorage
  window.addEventListener('load', async () => {
    const savedPin = localStorage.getItem('hermes_pin');
    if (!savedPin) return;
    try {
      const res = await fetch('/api/hermes/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: savedPin })
      });
      const data = await res.json();
      if (data.success) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.href = next;
      }
    } catch (e) {}
  });
</script>
</body>
</html>
